name: PR Project Status Sync

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

jobs:
  sync-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        id: find-issue
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN }}
          result-encoding: string
          script: |
            const body = context.payload.pull_request.body || '';
            const title = context.payload.pull_request.title || '';

            // Buscar "Closes #N", "Fixes #N", "Resolves #N" en el body o title
            const match = body.match(/(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s*#(\d+)/i)
                       || title.match(/#(\d+)/);
            if (match) {
              const issueNumber = parseInt(match[1], 10);
              console.log(`Found linked issue: #${issueNumber}`);
              return String(issueNumber);
            }
            console.log('No linked issue found in PR body or title');
            return '';

      - name: Move project card
        id: move-card
        if: steps.find-issue.outputs.result != ''
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ steps.find-issue.outputs.result }}
          PR_STATE: ${{ github.event.pull_request.merged && 'merged' || github.event.pull_request.state }}
          PR_ACTION: ${{ github.event.action }}
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN }}
          script: |
            const issueNumber = parseInt(process.env.ISSUE, 10);
            const isMerged = process.env.PR_STATE === 'merged';
            const action = process.env.PR_ACTION;

            let targetStatus;
            if (isMerged) {
              targetStatus = 'Done';
            } else if (action === 'opened' || action === 'ready_for_review') {
              targetStatus = 'In review';
            } else {
              console.log(`Action '${action}' no requiere cambio de status`);
              return;
            }

            console.log(`Issue #${issueNumber} → moving to "${targetStatus}"`);

            const owner = 'LuisRojas260305';
            const projectNumber = 1;

            const projectData = await github.graphql(`
              query($owner: String!, $projectNumber: Int!) {
                user(login: $owner) {
                  projectV2(number: $projectNumber) {
                    id
                    title
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner, projectNumber });

            const project = projectData.user.projectV2;
            const projectId = project.id;
            console.log(`Project: "${project.title}" (${projectId})`);

            const statusField = project.fields.nodes.find(f => f.name === 'Status');
            if (!statusField) {
              console.log('ERROR: No "Status" field. Available:',
                project.fields.nodes.map(o => o.name).join(', '));
              process.exit(1);
            }

            const normalize = s => s.toLowerCase().replace(/[-_\s]+/g, ' ');
            const targetOption = statusField.options.find(o =>
              normalize(o.name) === normalize(targetStatus)
            );
            if (!targetOption) {
              console.log(`ERROR: No '${targetStatus}' option. Available:`,
                statusField.options.map(o => o.name).join(', '));
              process.exit(1);
            }

            console.log(`Status field: ${statusField.id}`);
            console.log(`Target option: ${targetOption.name} (${targetOption.id})`);

            const itemData = await github.graphql(`
              query($projectId: ID!, $issueNumber: Int!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 50) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { projectId, issueNumber });

            const item = itemData.node.items.nodes.find(
              n => n.content && n.content.number === issueNumber
            );

            if (!item) {
              console.log(`Issue #${issueNumber} not found in project board.`);
              return;
            }

            console.log(`Found item: ${item.id}`);

            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item { id }
                }
              }
            `, {
              projectId,
              itemId: item.id,
              fieldId: statusField.id,
              optionId: targetOption.id
            });

            console.log(`✅ Issue #${issueNumber} moved to "${targetOption.name}"`);
